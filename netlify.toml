# Netlify config for the Parchment docs site (Next.js + Fumadocs).
# The Essential Next.js plugin auto-detects and sets the publish directory.
#
# No environment variables are required. The API reference pages under
# content/docs/api are committed, and the `API Reference` workflow regenerates
# them from Parchment's committed OpenAPI spec — not at build time — so a
# deploy never depends on a Parchment instance being reachable.
#
# To regenerate locally: `bun run generate:api`, optionally with OPENAPI_SPEC
# pointed at a local spec file or a running server's /docs/json.

[build]
  command = "bun run build"

[build.environment]
  NODE_VERSION = "20"
