name: API Reference

# Regenerates content/docs/api/ from Parchment's committed OpenAPI spec and
# opens a PR when it has drifted.
#
# Deliberately pull-based rather than triggered by Parchment: a cross-repo
# dispatch needs a PAT, and a scheduled fetch of a public file needs no secret
# at all. If you'd rather have it update the moment the API changes, add a
# repository_dispatch trigger here and a dispatch step to Parchment's
# openapi.yml workflow with a token that can write to this repo.

on:
  schedule:
    # Daily, offset off the hour so it isn't queued with everything else.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: 'OpenAPI spec URL or path (blank uses the committed spec on parchment@dev)'
        required: false
        type: string

jobs:
  generate:
    name: Regenerate reference
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate API reference
        env:
          # `inputs` is empty on a scheduled run, and an empty value would make
          # the script regenerate from the spec already vendored here — which
          # can never drift. 'upstream' pulls Parchment's published spec, which
          # is the whole point of the schedule.
          OPENAPI_SPEC: ${{ inputs.spec || 'upstream' }}
        run: bun run generate:api

      - name: Check for changes
        id: diff
        run: |
          # The vendored spec counts too: refreshing it without committing it
          # would leave the next run regenerating the same diff forever.
          if git diff --quiet -- content/docs/api openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- content/docs/api openapi.json
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/api-reference-$(date +%Y%m%d)"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Reuse the day's branch so a re-run updates its PR instead of
          # stacking near-identical ones. The branch is rebuilt from the
          # default branch each time and only ever holds generated output, so
          # overwriting it is the intent — and --force-with-lease can't help
          # here anyway, since checkout never fetched the branch to lease.
          git checkout -B "$BRANCH"
          git add content/docs/api openapi.json
          git commit -m 'Regenerate API reference from OpenAPI spec'
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'Regenerate API reference from OpenAPI spec' \
              --body 'Parchment'"'"'s OpenAPI spec has changed. Regenerated by the `API Reference` workflow.

These files are generated — review the diff for unexpected route removals, then merge.'
          fi
