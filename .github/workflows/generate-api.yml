name: API Reference

# Regenerates content/docs/api/ from Parchment's committed OpenAPI spec and
# opens a PR when it has drifted.
#
# Deliberately pull-based rather than triggered by Parchment: a cross-repo
# dispatch needs a PAT, and a scheduled fetch of a public file needs no secret
# at all. If you'd rather have it update the moment the API changes, add a
# repository_dispatch trigger here and a dispatch step to Parchment's
# openapi.yml workflow with a token that can write to this repo.

on:
  schedule:
    # Daily, offset off the hour so it isn't queued with everything else.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: 'OpenAPI spec URL or path (blank uses the committed spec on parchment@dev)'
        required: false
        type: string

jobs:
  generate:
    name: Regenerate reference
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate API reference
        env:
          OPENAPI_SPEC: ${{ inputs.spec }}
        run: bun run generate:api

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- content/docs/api; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- content/docs/api
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/api-reference-$(date +%Y%m%d)"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Reuse the day's branch if an earlier run already opened one, so a
          # re-run amends its PR instead of stacking up near-identical ones.
          git checkout -B "$BRANCH"
          git add content/docs/api
          git commit -m 'Regenerate API reference from OpenAPI spec'
          git push --force-with-lease origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'Regenerate API reference from OpenAPI spec' \
              --body 'Parchment'"'"'s OpenAPI spec has changed. Regenerated by the `API Reference` workflow.

These files are generated — review the diff for unexpected route removals, then merge.'
          fi
